[project]
name = "atelier"
version = "0.1.0"
description = "A local harness lab for AI-assisted mathematics"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "pygments>=2.18",
    "watchfiles>=0.24",
    "python-multipart>=0.0.9",
    "linkify-it-py>=2.0",
    "pypdfium2>=4.30",
]

[project.scripts]
atelier = "atelier.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atelier", "deslopify/deslopify"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "deslopify/tests"]
